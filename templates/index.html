<!DOCTYPE html>
<html>
<head>
    <title>Smart Classroom Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f8f9fa; padding-top: 50px; }
        .dashboard-card { border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .status-occupied { color: #dc3545; font-weight: bold; }
        .status-empty { color: #198754; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card dashboard-card p-4">
                <h2 class="text-center mb-4">Classroom Occupancy Predictor</h2>
                
                <form action="/predict_web" method="post">
                    <div class="mb-3">
                        <label class="form-label">Temperature (°C)</label>
                        <input type="number" step="0.1" name="Temperature" class="form-control" value="22.5" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Humidity (%)</label>
                        <input type="number" step="0.1" name="Humidity" class="form-control" value="25.2" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Light (Lux)</label>
                        <input type="number" step="0.1" name="Light" class="form-control" value="450" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">CO2 (ppm)</label>
                        <input type="number" step="1" name="CO2" class="form-control" value="600" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Check Occupancy</button>
                </form>
                {% if error %}
                <div class="alert alert-danger mt-4 text-center">
                    <strong>Validation Error:</strong> {{ error }}
                </div>
                {% endif %}
                {% if result %}
                <div class="mt-4 text-center border-top pt-3">
                    <h4>Result: 
                        <span class="{{ 'status-occupied' if result.status == 'Occupied' else 'status-empty' }}">
                            {{ result.status }}
                        </span>
                    </h4>
                    <p class="text-muted small">Model confidence: {{ result.confidence }}</p>
                </div>
                {% endif %}
            </div>
        </div>
    </div>
</div>
</body>
</html>
